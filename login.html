<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — ChatFlow AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card glass">
    <div class="brand-mark">CF</div>
    <h1 id="auth-title">Welcome to ChatFlow AI</h1>
    <p id="auth-sub">Sign in with Google to reach your dashboard. New here? Signing in creates your account automatically.</p>

    <button class="google-btn" onclick="signInWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.6 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.2 4 9.5 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.3 0 10.1-2 13.7-5.4l-6.3-5.3C29.4 34.9 26.8 36 24 36c-5.3 0-9.8-3.4-11.4-8.1l-6.5 5C9.4 39.6 16.1 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1 2.8-2.9 5.1-5.4 6.6l6.3 5.3C39.9 36.9 44 31 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      Continue with Google
    </button>

    <div class="auth-foot">By continuing you agree to ChatFlow AI's Terms and Privacy Policy.</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="firebase.js"></script>
<script src="app.js"></script>
<script>
  // If ?admin=1 is present, this login was reached via an admin-only redirect.
  const isAdminFlow = new URLSearchParams(location.search).get("admin") === "1";
  if (isAdminFlow) {
    document.querySelector("#auth-title").textContent = "Admin sign in";
    document.querySelector("#auth-sub").textContent = "Sign in with the Google account registered as an administrator.";
  }

  // If already signed in, skip straight to the right dashboard.
  auth.onAuthStateChanged(async (user) => {
    if (!user) return;
    if (isAdminFlow) {
      const adminSnap = await db.ref("admins/" + user.uid).get();
      window.location.href = adminSnap.exists() ? "admin.html" : "dashboard.html";
    } else {
      window.location.href = "dashboard.html";
    }
  });
</script>
</body>
</html>
